name: iOS IPA (Flutter → TestFlight)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14

    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      APP_NAME: ${{ secrets.APP_NAME }}
      APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      PROVISIONING_PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      P12_B64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      CI_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure CocoaPods
        run: |
          sudo gem install cocoapods -N || true
          cd ios && pod repo update && pod install --repo-update && cd ..

      - name: Set build version (Info.plist)
        shell: bash
        run: |
          echo "Setting iOS build to ${CI_BUILD_NUMBER}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${CI_BUILD_NUMBER}" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" ios/Runner/Info.plist || true

      - name: Decode signing assets
        shell: bash
        run: |
          mkdir -p signing
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > signing/appstore.mobileprovision
          echo "$P12_B64" | base64 --decode > signing/dist.p12
          echo "$APPLE_API_KEY_B64" | base64 --decode > signing/AuthKey.p8

      - name: Create keychain & import p12
        shell: bash
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p "" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          security import signing/dist.p12 -k $KEYCHAIN -P "$P12_PASSWORD" -A
          security list-keychains -d user -s $KEYCHAIN $(security list-keychains -d user | sed 's/["|,]//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN

      - name: Install provisioning profile
        shell: bash
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i signing/appstore.mobileprovision)")
          cp signing/appstore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "Provisioning UUID: $UUID"
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Create ExportOptions.plist
        shell: bash
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA (archive)
        shell: bash
        run: |
          flutter clean
          flutter build ipa --release --build-number=${CI_BUILD_NUMBER} --export-options-plist=ExportOptions.plist

      - name: Show build outputs
        run: |
          ls -la build/ios/ipa || true
          ls -la build/ios/archive/Runner.xcarchive || true

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: gem install fastlane --no-document

      - name: Upload to TestFlight (fastlane pilot)
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        shell: bash
        run: |
          IPA_PATH="build/ios/ipa/${APP_NAME}.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            IPA_PATH="build/ios/ipa/Runner.ipa"
          fi
          echo "Uploading: $IPA_PATH"
          fastlane pilot upload \
            --api_key_path signing/AuthKey.p8 \
            --api_key_id "$APPLE_KEY_ID" \
            --api_issuer "$APPLE_ISSUER_ID" \
            --ipa "$IPA_PATH" \
            --skip_waiting_for_build_processing true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive
