flutter_launcher_icons:
  android: true
  ios: true

  # Full-bleed square source, corners squared off and drop shadow removed.
  # Android and iOS each apply their own mask, so a pre-rounded source would be
  # rounded twice and show shadow fringing along the cut. Generated from the
  # supplied artwork by tool/prepare_icons.py — edit that, not these outputs.
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 23

  # Adaptive icon (Android 8+): the launcher can crop to any shape and only the
  # centre ~66% is guaranteed visible, so the foreground is the artwork inset on
  # a transparent canvas rather than the full-bleed square above.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

  web:
    generate: false
